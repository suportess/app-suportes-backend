server:
  port: 8031
  servlet:
    context-path: /api

spring:
  application:
    name: app-suportes-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:suportes}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

portal:
  base-url: ${PORTAL_URL:http://localhost:9000}
  apikey: ${PORTAL_APIKEY:}
  timeout-seconds: 30

rag:
  base-url: ${RAG_BASE_URL:http://app-suportes-rag-dbamv:8032}
  timeout-seconds: ${RAG_TIMEOUT_SECONDS:60}

ngrok:
  api-key: ${NGROK_API_KEY:}
  authtoken: ${NGROK_AUTHTOKEN:1wEeUPG2XYPWx7Y1Cvh35TmiZtB_ZAxo21YxEMwz1KAb5hmk}
  base-url: ${NGROK_BASE_URL:https://api.ngrok.com}
  timeout-seconds: ${NGROK_TIMEOUT_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    br.tec.suportes: INFO
    org.springframework.web: WARN
