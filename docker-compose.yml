# ─────────────────────────────────────────────────────────────────────────────
# app-suportes-backend — VPS
#
# As variáveis são injetadas pelo CI/CD via secret APP_ENV no GitHub Actions.
# Para rodar manualmente:
#   cp .env.example .env
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  app-suportes-backend:
    image: ${DOCKER_USERNAME:-suportess}/app-suportes-backend:${IMAGE_TAG:-latest}
    container_name: app-suportes-backend
    restart: unless-stopped
    env_file: .env.app
    expose:
      - "8031"
    networks:
      - infra-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-suportes-backend.rule=Host(`api.suportes.tec.br`)"
      - "traefik.http.routers.app-suportes-backend.entrypoints=websecure"
      - "traefik.http.routers.app-suportes-backend.tls=true"
      - "traefik.http.routers.app-suportes-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-suportes-backend.loadbalancer.server.port=8031"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8031/api/actuator/health | grep -q '\"UP\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  infra-net:
    external: true
    name: infra-net
  proxy:
    external: true
    name: proxy
